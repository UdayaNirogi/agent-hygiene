[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hygiene"
version = "0.1.0"
description = "Inventory and clean up what coding-agent CLIs (Codex, Claude Code, Cursor, Gemini, ...) leave behind on macOS and Linux."
readme = "README.md"
authors = [
    {name = "Udaya Nirogi", email = "data.pycap@gmail.com"}
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["cli", "agents", "codex", "claude-code", "cursor", "gemini", "cleanup", "launchagents", "systemd"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/UdayaNirogi/agent-hygiene"

[project.scripts]
agent-hygiene = "agent_hygiene.cli:main"

[tool.setuptools.packages.find]
include = ["agent_hygiene*"]
